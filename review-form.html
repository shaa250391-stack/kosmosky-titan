<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Review form</title><meta name="robots" content="noindex"></head>
<body>
  <!-- Служебная форма: по ней Netlify при выкладке регистрирует форму review. Заметки шлёт режим ?review в d.html -->
  <form name="review" method="POST" data-netlify="true">
    <input name="section"><input name="selector"><input name="snippet"><input name="point">
    <input name="viewport"><input name="page"><textarea name="note"></textarea>
  </form>
</body>
</html>
